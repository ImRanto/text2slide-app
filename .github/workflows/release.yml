name: Release

on:
  push:
    tags:
      - 'v*'

# Le dépôt privé n'a besoin que de lire le code.
# La publication vers le dépôt public utilise RELEASES_TOKEN.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          # Token limité au dépôt public ImRanto/text2slide-app (Contents: read/write)
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}